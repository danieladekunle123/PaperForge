<!doctype html>
<!-- PaperForge project thumbnail: the logo's two sheets frame the real app, which sits where the logo's amber page goes. Render at 1600x900. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PaperForge thumbnail</title>
<style>
  :root {
    --bg: #0f1114; --ember: #e39a4d; --sheet: #f5f2ec; --muted: #a2a9b3; --line: #2c3138;
    --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body { position: relative; background: var(--bg); color: var(--sheet); font-family: var(--sans); }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(760px 620px at 1108px 450px, rgba(227, 154, 77, .34), transparent 72%),
    radial-gradient(520px 340px at 40px 900px, rgba(227, 154, 77, .10), transparent 70%); }

  .left { position: absolute; left: 84px; top: 76px; width: 560px; }
  .logo { display: block; width: 440px; height: auto; margin-left: -6px; }
  h1 { margin-top: 44px; font-size: 104px; font-weight: 700; line-height: 1.03; letter-spacing: -2.5px; }
  h1 em { display: block; font-style: normal; color: var(--ember); }
  .sub { margin-top: 26px; font-size: 31px; font-weight: 400; line-height: 1.3; color: #d5d8dc; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .chip { display: flex; align-items: center; gap: 11px; padding: 12px 16px; border: 2px solid var(--line); background: rgba(21, 24, 28, .85); font-size: 23px; font-weight: 600; }
  .chip i { width: 11px; height: 11px; background: var(--ember); transform: rotate(45deg); }
  .url { position: absolute; left: 84px; bottom: 50px; font: 700 20px/1 var(--mono); letter-spacing: 1.5px; color: var(--muted); }
  .url b { color: var(--sheet); }

  .sheets { position: absolute; inset: 0; }
  .window { position: absolute; left: 728px; top: 167.5px; width: 760px; height: 565px; filter: drop-shadow(0 0 3px var(--ember)) drop-shadow(0 0 30px rgba(227, 154, 77, .55)); }
  .window img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top;
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 0 100%); }
</style>
</head>
